server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.cms.itqan.dev https://storage.cms.itqan.dev https://pub-9ee413c8af4041c6bd5223d08f5d0f0f.r2.dev; media-src 'self' https://storage.cms.itqan.dev https://pub-9ee413c8af4041c6bd5223d08f5d0f0f.r2.dev; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location /Quran/ {
        try_files $uri $uri/ /Quran/index.html;
    }

    location / {
        rewrite ^/$ /Quran/ permanent;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff|woff2|eot|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
