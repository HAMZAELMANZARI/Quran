name: Build and Deploy to IBM Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IBM_CLOUD_REGION: eu-es
  REGISTRY_HOSTNAME: de.icr.io
  IMAGE_NAME: quran-app
  RESOURCE_GROUP: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install container-registry -f
          ibmcloud plugin install kubernetes-service -f

      - name: Authenticate with IBM Cloud
        run: |
          ibmcloud login -a "https://cloud.ibm.com" -r "${IBM_CLOUD_REGION}" -g "${RESOURCE_GROUP}" --apikey "${IBM_CLOUD_API_KEY}"
          ibmcloud cr region-set "${REGISTRY_HOSTNAME}"
          ibmcloud cr login

      - name: Build Docker image
        run: |
          docker build -t "${REGISTRY_HOSTNAME}/${IBM_CLOUD_NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}" .
          docker tag "${REGISTRY_HOSTNAME}/${IBM_CLOUD_NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY_HOSTNAME}/${IBM_CLOUD_NAMESPACE}/${IMAGE_NAME}:latest"

      - name: Push image to IBM Cloud Container Registry
        run: |
          docker push "${REGISTRY_HOSTNAME}/${IBM_CLOUD_NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${REGISTRY_HOSTNAME}/${IBM_CLOUD_NAMESPACE}/${IMAGE_NAME}:latest"

      - name: Deploy to Kubernetes
        run: |
          ibmcloud ks cluster config --cluster "${IKS_CLUSTER_NAME}"
          kubectl set image deployment/quran-app quran-app="${REGISTRY_HOSTNAME}/${IBM_CLOUD_NAMESPACE}/${IMAGE_NAME}:${GITHUB_SHA}"
          kubectl rollout status deployment/quran-app
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          IBM_CLOUD_NAMESPACE: ${{ secrets.IBM_CLOUD_NAMESPACE }}
          IKS_CLUSTER_NAME: ${{ secrets.IKS_CLUSTER_NAME }}
